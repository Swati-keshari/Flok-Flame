# Render blueprint for the backend (https://render.com → New → Blueprint → pick this repo).
# Secret values (MONGO_URI, JWT_SECRET, Razorpay, Gmail) are typed in the Render dashboard, never here.
services:
  - type: web
    name: fork-flame-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    # start the server directly (npm start would try to start a local MongoDB first)
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
